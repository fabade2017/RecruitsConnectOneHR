version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: onehr-mysql-prod
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_USER: ${MYSQL_USER:-onehr}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-onehr_prod_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-onehr}
    volumes:
      - mysqldata_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: onehr-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-onehr_redis_change_me}
    volumes:
      - redis_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-onehr_redis_change_me} --no-auth-warning ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: onehr-api-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-onehr}:${MYSQL_PASSWORD:-onehr_prod_change_me}@mysql:3306/${MYSQL_DATABASE:-onehr}
      DIRECT_URL: mysql://${MYSQL_USER:-onehr}:${MYSQL_PASSWORD:-onehr_prod_change_me}@mysql:3306/${MYSQL_DATABASE:-onehr}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://onehr.recruitconnect.ng}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      REDIS_URL: redis://:${REDIS_PASSWORD:-onehr_redis_change_me}@redis:6379
    ports:
      - "${PORT_API:-3001}:3001"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/v1/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    container_name: onehr-web-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.recruitconnect.ng/v1}
    ports:
      - "${PORT_WEB:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Optional: nginx reverse proxy (uncomment for single-host deploy)
  # nginx:
  #   image: nginx:alpine
  #   volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  #   ports: ["80:80", "443:443"]
  #   depends_on: [api, web]

volumes:
  mysqldata_prod:
  redis_prod: