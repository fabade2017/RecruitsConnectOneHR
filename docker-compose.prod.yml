version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: onehr-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onehr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onehr_prod_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-onehr}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onehr}"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: onehr-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: onehr-api-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-onehr}:${POSTGRES_PASSWORD:-onehr_prod_change_me}@postgres:5432/${POSTGRES_DB:-onehr}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://onehr.recruitconnect.ng}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      REDIS_URL: redis://redis:6379
    ports:
      - "${PORT_API:-3001}:3001"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/v1/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    container_name: onehr-web-prod
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.recruitconnect.ng/v1}
    ports:
      - "${PORT_WEB:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Optional: nginx reverse proxy (uncomment for single-host deploy)
  # nginx:
  #   image: nginx:alpine
  #   volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
  #   ports: ["80:80", "443:443"]
  #   depends_on: [api, web]

volumes:
  pgdata_prod:
  redis_prod:
