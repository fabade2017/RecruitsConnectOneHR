version: "3.9"
# AWS single-host deploy (EC2 / Lightsail) — MSSQL onehr_v2 + Redis + API + Web + Ava Chatbot :8003
# Usage on EC2 (Ubuntu 22.04, t3.small 2vCPU/2GB):
#   sudo apt update && sudo apt install docker.io docker-compose-plugin -y
#   git clone <repo> && cd ProjectA
#   cp .env.example .env  # then fill RDS/ secrets below
#   docker compose -f docker-compose.aws.yml up -d --build
#   docker compose -f docker-compose.aws.yml exec api npx prisma migrate deploy
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onehr-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD:-SQLserver@ta2}
      MSSQL_PID: Developer
    ports:
      - "${PORT_MSSQL:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: onehr-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    container_name: onehr-api
    environment:
      NODE_ENV: production
      # Use RDS if provided, else local mssql service
      DATABASE_URL: ${DATABASE_URL:-sqlserver://mssql:1433;database=onehr_v2;user=sa;password=SQLserver@ta2;encrypt=true;trustServerCertificate=true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://onehr.yourdomain.com}
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_CHATBOT_API: ${NEXT_PUBLIC_CHATBOT_API:-https://chatbot.yourdomain.com}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OLLAMA_URL: ${OLLAMA_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports:
      - "${PORT_API:-3001}:3001"
    depends_on:
      mssql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/v1/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    container_name: onehr-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com/v1}
      NEXT_PUBLIC_CHATBOT_API: ${NEXT_PUBLIC_CHATBOT_API:-https://chatbot.yourdomain.com}
    ports:
      - "${PORT_WEB:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  chatbot:
    # Your Python Ava agent on :8003 — build from ./chatbot if you have Dockerfile, else use prebuilt image
    # Place your chatbot code at ./chatbot/Dockerfile (FastAPI uvicorn)
    build: { context: ./chatbot, dockerfile: Dockerfile }
    container_name: onehr-chatbot
    environment:
      PORT: 8003
      CORS_ORIGINS: ${CORS_ORIGINS:-https://onehr.yourdomain.com,https://www.yourdomain.com}
    ports:
      - "${PORT_CHATBOT:-8003}:8003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/api/health"]
      interval: 30s
      retries: 3
    restart: unless-stopped

  # Optional: Caddy reverse proxy with auto TLS (uncomment for single EC2 with domain)
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: onehr-caddy
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on: [api, web, chatbot]
  #   restart: unless-stopped

volumes:
  mssql_data:
  redis_data:
  # caddy_data:
  # caddy_config:
