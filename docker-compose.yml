version: "3.9"
services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: onehr-db
    environment:
      POSTGRES_USER: onehr
      POSTGRES_PASSWORD: onehr
      POSTGRES_DB: onehr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onehr"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: onehr-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: onehr-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Optional: pgvector + postgis are in postgis image; enable via init script
volumes:
  pgdata:
  miniodata:
